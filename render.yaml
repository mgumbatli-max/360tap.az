# 360tap.az — Render Blueprint (backend: NestJS + Postgres + Redis + Meilisearch)
# Qeyd: Bu starter şablondur; Render Dashboard → "New Blueprint" ilə repo-dan deploy edin.
# Frontend ayrıca Vercel-ə (bax DEPLOY.md).

databases:
  - name: tap360-db
    plan: free
    databaseName: tap360
    user: tap360

services:
  # Redis (Render Key Value)
  - type: keyvalue
    name: tap360-redis
    plan: free
    ipAllowList: [] # yalnız daxili

  # Meilisearch (private service, Docker image)
  - type: pserv
    name: tap360-meili
    runtime: image
    image:
      url: getmeili/meilisearch:v1.10
    plan: starter
    envVars:
      - key: MEILI_MASTER_KEY
        generateValue: true
      - key: MEILI_ENV
        value: production

  # NestJS API (Docker)
  - type: web
    name: tap360-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5500
      - key: DATABASE_URL
        fromDatabase:
          name: tap360-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tap360-redis
          property: connectionString
      - key: MEILI_HOST
        value: http://tap360-meili:7700 # private service daxili adı
      - key: MEILI_KEY
        fromService:
          type: pserv
          name: tap360-meili
          envVarKey: MEILI_MASTER_KEY
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 900
      - key: JWT_REFRESH_TTL
        value: 604800
      - key: THROTTLE_TTL
        value: 60
      - key: THROTTLE_LIMIT
        value: 300
      # Vercel domeni deploy-dan sonra əl ilə təyin olunur:
      - key: CORS_ORIGINS
        sync: false
      - key: MEDIA_BASE_URL
        sync: false
