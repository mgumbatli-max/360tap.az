# 360tap.az — Render Blueprint (NestJS API + Postgres + Redis)
# Frontend ayrıca Vercel-də (bax DEPLOY.md).
#
# Faza 0 qeydi — BLUEPRINT DRIFT:
#   Bəzi dəyişənlər (GROQ_API_KEY, MEILI_HOST/MEILI_KEY) əvvəllər YALNIZ Render
#   dashboard-unda əl ilə təyin olunmuşdu və bu faylda ya yox idi, ya da yalançı
#   `localhost` dəyəri ilə görünürdü. Nəticə: blueprint reallığı əks etdirmirdi və
#   servis blueprint-dən yenidən yaradılsaydı həmin dəyərlər itəcəkdi.
#   İndi hamısı `sync: false` ilə ELAN OLUNUB: dəyər dashboard-da qalır (repoda secret yoxdur),
#   amma dəyişənin MÖVCUDLUĞU koddan görünür.

databases:
  - name: tap360-db
    plan: free
    databaseName: tap360
    user: tap360

services:
  # Redis (Render Key Value) — pulsuz
  - type: keyvalue
    name: tap360-redis
    plan: free
    ipAllowList: []

  # NestJS API (Docker) — pulsuz web service
  - type: web
    name: tap360-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    # LIVENESS probe — xarici asılılıqları yoxlamır, yalnız prosesin diri olduğunu.
    # Readiness (DB/search vəziyyəti) ayrıca: GET /health/ready
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "5500"
      - key: DATABASE_URL
        fromDatabase:
          name: tap360-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tap360-redis
          property: connectionString
      # Redis DNS həllində IP ailəsi. Render-in Key Value servisi daxili şəbəkədə
      # YALNIZ IPv6 üzərindən verilir, `ioredis` isə defolt olaraq yalnız IPv4-ə
      # baxır — nəticədə host həll olunmur və klient sonsuz `reconnecting`
      # vəziyyətində qalırdı (canlıda ölçüldü, /health/ready aylarla belə idi).
      # Kod defoltu onsuz da 0-dır; dəyər burada AÇIQ yazılır ki, davranış
      # blueprint-dən görünsün və təsadüfən dəyişdirilməsin.
      - key: REDIS_FAMILY
        value: "0"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "604800"
      - key: THROTTLE_TTL
        value: "60"
      - key: THROTTLE_LIMIT
        value: "300"

      # --- Axtarış (OPSİONAL) ---
      # Təyin olunmasa API "degraded" rejimdə işləyir: /search Postgres fallback-i ilə
      # cavab verir, listing CRUD isə heç bir halda axtarışdan asılı deyil.
      # Dəyər Render dashboard-unda saxlanılır (sync: false → blueprint üzərinə yazmır).
      - key: MEILI_HOST
        sync: false
      - key: MEILI_KEY
        sync: false

      # --- AI (OPSİONAL) ---
      # Yoxdursa /ai/* endpoint-ləri aydın xəta qaytarır; qalan API işləyir.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      # Kodda istifadə olunur (ai.service.ts vision axını), blueprint-də çatışmırdı.
      - key: GROQ_VISION_MODEL
        sync: false

      # --- E-POÇT (OPSİONAL, LAKİN QEYDİYYAT ÜÇÜN LAZIM) ---
      # Təyin olunmasa mail «console» adapterinə düşür: mektub GÖNDƏRİLMİR, yalnız
      # loga yazılır. API çökmür, qeydiyyat işləyir — sadəcə təsdiq mektubu getmir.
      # MAIL_PROVIDER=resend olduqda MAIL_API_KEY məcburidir.
      # MAIL_FROM-dakı domen provayderdə TƏSDİQLƏNMİŞ olmalıdır (SPF+DKIM DNS qeydləri).
      - key: MAIL_PROVIDER
        sync: false
      - key: MAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- SMS / OTP (OPSİONAL) ---
      # SMS_PROVIDER: `twilio` (müqavilə tələb etmir) və ya `http` (lokal AZ aqreqator).
      # Təyin olunmasa «console»: kod loga yazılır, SMS getmir — dev/staging üçün.
      # ⚠️ Bu endpoint-lər PULA çevrilir — auth.controller-də sərt @Throttle var.
      - key: SMS_PROVIDER
        sync: false
      - key: SMS_ACCOUNT_SID
        sync: false
      - key: SMS_AUTH_TOKEN
        sync: false
      # Twilio-da göndərən nömrə; lokal aqreqatorda operatorlarda təsdiqlənmiş alfa-nömrə.
      - key: SMS_FROM
        sync: false
      # Yalnız SMS_PROVIDER=http olduqda: aqreqatorun endpoint-i və tokeni.
      - key: SMS_HTTP_URL
        sync: false
      - key: SMS_HTTP_TOKEN
        sync: false

      # --- Rate limit açarı (müştəri IP-si) ---
      # Vercel middleware hər /api/* sorğusuna istifadəçinin real IP-sini bu sirrlə
      # imzalayıb göndərir; backend imzanı yoxlayır (bax api/src/common/client-ip.ts).
      # DƏYƏR VERCEL-DƏKİ INTERNAL_IP_SECRET İLƏ EYNİ OLMALIDIR — fərqli olsa imza
      # yoxlanmır və rate limit yenidən bütün ziyarətçilər üçün eyni açara düşür.
      # NİYƏ LAZIM OLDU: canlıda ölçüldü ki, XFF hop məntiqi proxy arxasında
      # Render-in daxili sabit IP-sini seçir — 14 sorğu ilə saytın girişini hamıya
      # bağlamaq mümkün idi (bax /api/health/net diaqnostikası).
      - key: INTERNAL_IP_SECRET
        sync: false

      # --- Saytın ictimai ünvanı ---
      # Mektublardakı linklər (e-poçt təsdiqi, parol sıfırlama) bundan qurulur.
      - key: PUBLIC_URL
        value: "https://360tap.az"

      # --- Media ---
      # ⚠️ Render free tier-də disk EFEMERDİR: bu qovluqdakı fayllar hər deploy/restart-da
      # silinir. Kalıcı həll (obyekt storage + CDN) Faza 1-dədir.
      - key: MEDIA_DIR
        value: "./uploads"
      - key: MEDIA_BASE_URL
        value: "https://tap360-api.onrender.com/uploads"

      # Vercel proxy server-side olduğu üçün CORS funksional kritik deyil,
      # lakin canlı domen siyahıda olmalıdır (gələcək birbaşa brauzer→API çağırışları üçün).
      # DİQQƏT: `http://localhost:5401` bu siyahıdan ÇIXARILDI — production API
      # `credentials: true` ilə həmin origin-i əks etdirirdi, yəni developerin öz
      # maşınındakı 5401 portu canlı API-yə brauzerdən girə bilirdi.
      # Nəticə: lokal frontend-i BİRBAŞA canlı API-yə bağlayan debug axını artıq
      # brauzerdə CORS ilə bloklanacaq (SSR/proxy yolu təsirlənmir). Belə bir axın
      # lazımdırsa ayrıca preview servisi üçün öz CORS_ORIGINS dəyəri təyin edilsin.
      - key: CORS_ORIGINS
        value: "https://360tap.az,https://www.360tap.az,https://360tap-az.vercel.app"
