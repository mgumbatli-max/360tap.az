# 360tap.az — Render Blueprint (PULSUZ: NestJS API + Postgres + Redis)
# Meilisearch sonra əlavə olunur (pulsuz private service yoxdur) — axtarış o vaxta qədər degrade.
# Frontend ayrıca Vercel-də (bax DEPLOY.md).

databases:
  - name: tap360-db
    plan: free
    databaseName: tap360
    user: tap360

services:
  # Redis (Render Key Value) — pulsuz
  - type: keyvalue
    name: tap360-redis
    plan: free
    ipAllowList: []

  # NestJS API (Docker) — pulsuz web service
  - type: web
    name: tap360-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "5500"
      - key: DATABASE_URL
        fromDatabase:
          name: tap360-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tap360-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: "900"
      - key: JWT_REFRESH_TTL
        value: "604800"
      - key: THROTTLE_TTL
        value: "60"
      - key: THROTTLE_LIMIT
        value: "300"
      # Meilisearch hələ yoxdur — degrade (app boot olur, search xəta tutulur)
      - key: MEILI_HOST
        value: "http://localhost:7700"
      - key: MEILI_KEY
        value: ""
      # Vercel proxy server-side olduğu üçün CORS funksional kritik deyil (boş olmamalıdır):
      - key: CORS_ORIGINS
        value: "https://360tap-az.vercel.app,http://localhost:5401"
      - key: MEDIA_BASE_URL
        value: "https://tap360-api.onrender.com/uploads"
